name: deploy

# Deploy the bounded.tools Worker from CI — with NO stored Cloudflare token.
# Same lane shape as infra's status-deploy.yml / broker-deploy.yml and
# front-desk-scheduler's lease-deploy.yml: OIDC → the broker's
# /deploy/bounded-tools tier mints a short-lived Workers Scripts:Edit token, a
# human authorizes BEFORE the mint with a Face ID ceremony, `wrangler deploy` uses
# it, then a probe confirms the deployed hostnames actually serve.
#
# THE GATE IS A FACE ID CEREMONY, not a comment (infra#480, carried here by
# infra#538). There is no break-glass (infra#18): while keeper.bounded.tools is
# down this lane does not run. The ceremony step records why that is the right
# trade for this lane specifically.
#
# Cross-repo by design (the `lease` precedent): the Worker's source lives here
# with its tests, and the broker pins workflowRef exactly, so which FILE may
# mint does not depend on which repo holds it.
#
# What this deploys is the org's GitHub App receiver and the fleet CI snapshot
# (/ci.json, .github-private#481). Worth stating plainly: until this lane runs
# successfully, the App's hook_attributes.url points at a path the static site
# 404s — measured 2026-08-13 — so no delivery has ever been handled.
#
# BOOTSTRAP — what must exist before the first run, in order:
#   1. The `bounded-tools` entry in the broker's WORKERS_DEPLOY registry, live
#      — merged AND the broker redeployed (infra broker-deploy.yml, approved).
#      Until then the mint 404s "unknown deploy target": expected, not broken.
#   2. The `bounded-tools-deploy` Environment ON THIS REPO — the mint 401s
#      without its claim. NOT covered by infra's github-admin/environments.tf,
#      which manages infra's own environments only; this repo owns it, the same
#      way front-desk-scheduler owns `lease-deploy`.
#   3. For the webhook-secret sync (the step after Deploy): the broker's
#      /apphook tier live with its `bounded-tools` entry — which itself needs
#      the prx App's appId filled in the registry and GH_APP_PRX_PRIVATE_KEY
#      `wrangler secret put` on the BROKER (see the APP_HOOK_CONFIG comment in
#      infra's broker wrangler.jsonc). Until then the sync step fails loudly;
#      dispatch with sync_webhook_secret=false to deploy the Worker anyway.
#
# THE WEBHOOK SECRET IS AN OIDC ARTIFACT. No human ever holds it: each run
# with sync enabled generates a fresh value (openssl, masked), writes the
# Worker half under the same minted token (`wrangler secret put` is a script
# write — infra's `rotate` precedent), and writes the App half through the
# broker's /apphook tier, which PATCHes the App's hook config as the App.
# Rotation is a re-run. The receiver FAILS CLOSED while the halves disagree
# (every delivery rejected), which a partial failure of this step produces —
# the step says so and the fix is always: re-run the lane.
#
# The Durable Object namespace needs no pre-provisioning step (unlike status's
# STATUS_KV): `wrangler deploy` creates it from the migrations block. That is
# also why the registry entry is scripts-only. If a first deploy fails on the
# migration rather than the script, capture the refusal body verbatim — it is
# evidence for a new permission family, not a config error to guess at.

on:
  workflow_dispatch:
    inputs:
      sync_webhook_secret:
        description: >-
          Rotate the webhook secret on both sides (Worker Secret + App hook
          config) after deploying. Disable only to bootstrap the Worker before
          the broker's /apphook tier is live.
        type: boolean
        default: true
      rotate_relay_lease:
        description: >-
          Rotate the Claude chat-session relay's lease (#53): generate a fresh
          token inside the job, write `sessions:<token>` as the
          CLAUDE_RELAY_LEASES Worker Secret under the same minted credential,
          verify the relay's 503→401 flip on the live host, and print the token
          ONLY age-encrypted to lease_recipient. Overwrites the whole lease
          table (single-holder v1).
        type: boolean
        default: false
      grant_relay_lease:
        description: >-
          Grant a per-session relay bearer (#62): a lease NAME
          ([A-Za-z0-9._-]+, e.g. session-rqpjei). Writes `<name>:<token>` into
          the STALE grant slot (CLAUDE_RELAY_LEASES_A/_B, round-robin via the
          RELAY_LEASE_SLOT_LAST repo variable), displacing only the oldest
          grant — the standing line is untouched. Token emitted ONLY
          age-encrypted to lease_recipient.
        required: false
        default: ""
      lease_recipient:
        description: >-
          EPHEMERAL age recipient (age1… or ssh-ed25519/ssh-rsa) for the
          rotated or granted lease token — generate a throwaway keypair right
          before dispatching, decrypt this run's output with it, then delete
          it. Required with rotate_relay_lease or grant_relay_lease; validated
          BEFORE anything is written.
        required: false
        default: ""

permissions:
  id-token: write # OIDC -> broker /deploy/bounded-tools
  issues: write # the ceremony opens a notification issue carrying the approve URL
  actions: write # `gh variable set` — grant-slot bookkeeping (#62), names and dates only

# One deploy at a time; never cancel a deploy already in flight.
concurrency:
  group: bounded-tools-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: bounded-tools-deploy
    timeout-minutes: 60 # bound a forgotten approval rather than hanging a runner
    steps:
      - name: Refuse to deploy from any ref but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::bounded.tools deploys only from refs/heads/main (got ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # Tripwire: the same gate `standard` runs on every PR. A deploy must not
      # be the first thing to discover the Worker no longer builds.
      - name: Run tests + typecheck + worker build (tripwire)
        run: |
          bun install --frozen-lockfile
          bun test
          bun x tsc --noEmit
          WRANGLER_SEND_METRICS=false bun x wrangler deploy --dry-run

      # Human authorization BEFORE the mint — no credential exists until a Face ID has
      # signed THIS run's request (infra#480; the same shape as desk's deploy.yml and
      # keeper-deploy in bounded-systems/infra). The keeper URL is a literal on purpose:
      # a variable here would let configuration move the ceremony somewhere else.
      #
      # THIS REPLACED A COMMENT GATE (infra#538). infra#235 established that
      # `await-approval` cannot tell the dispatcher from the approver — whoever dispatches
      # a run can approve their own — so what it gated was a formality. infra#480 retired
      # it; this lane kept it only because the migration was rolled out to a LIST of lanes
      # rather than to everything matching the predicate, and nothing measured the
      # remainder. infra#538's `gate-strength` check now does, for infra; this repo is
      # outside that check's reach, which is why the migration had to be carried here by
      # hand.
      #
      # There is NO break-glass, following infra#18: a single-boolean bypass to a
      # mechanism known not to work is not a fallback. The test is whether the lane is
      # upstream of the keeper's own fix path — keeper-deploy keeps one because a broken
      # keeper cannot serve the ceremony that repairs it. This lane authorizes nothing the
      # keeper depends on, so while keeper.bounded.tools is down it simply does not run.
      - name: Open the Face ID ceremony
        id: ceremony
        env:
          KEEPER_URL: https://keeper.bounded.tools
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          req="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{v:"bounded.deploy-request.v1",repo:"bounded.tools",workflow:"deploy.yml",run_id:$run,head_sha:$sha}')"
          start="$(curl -sfS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"requestType\":\"bounded.deploy-request.v1\",\"request\":$req}" \
            "$KEEPER_URL/authorize/start")" || {
            echo "::error::the keeper refused to open a ceremony. There is no break-glass (infra#18): this lane does not run until keeper.bounded.tools is back."
            exit 1
          }
          ceremony="$(jq -r '.ceremonyId // empty' <<<"$start")"
          approve_url="$(jq -r '.approveUrl // empty' <<<"$start")"
          [ -n "$ceremony" ] && [ -n "$approve_url" ] || { echo "::error::keeper returned no ceremony"; exit 1; }
          echo "ceremony=$ceremony" >> "$GITHUB_OUTPUT"
          echo "request=$req" >> "$GITHUB_OUTPUT"
          echo "approve_url=$approve_url" >> "$GITHUB_OUTPUT"
          # The issue is a NOTIFICATION, not a credential: commenting on it does nothing.
          # The approval is the Face ID at the URL.
          issue_url="$(gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Face ID: approve bounded.tools deploy (run ${GITHUB_RUN_ID})" \
            --body "$(printf 'A bounded.tools deploy run wants to mint a short-lived account-wide Workers Scripts:Edit token (broker /deploy/bounded-tools) and `wrangler deploy` the GitHub App receiver + fleet CI snapshot Worker. With sync_webhook_secret it also rotates the webhook secret on both sides.\n\nApprove with your passkey (15-minute window):\n\n%s\n\nThis issue is a notification only — comments here authorize nothing (infra#480 retired the comment gate). Run: https://github.com/%s/actions/runs/%s' "$approve_url" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")")"
          echo "issue_url=$issue_url" >> "$GITHUB_OUTPUT"
          echo "ceremony open — approve at $approve_url"

      # BEFORE the wait below. The issue above is a GitHub notification — batched,
      # routed wherever GitHub decides, and no use against a window that can be as
      # short as two minutes. infra#552 gave the seven infra ceremony lanes a push;
      # this lane was not in that scope, and on 2026-08-31 a ceremony here opened,
      # waited its full window and reached no phone (infra#553).
      #
      # No guard, because the ceremony above has none: this lane has no break-glass
      # (infra#18), so if the ceremony ran, an approval is genuinely waiting.
      #
      # Non-fatal on every path. The gate is the Face ID; a notice that failed to
      # send must not fail a deploy that is otherwise authorized.
      - name: Notify subscribed devices that an approval is waiting
        env:
          APPROVE_URL: ${{ steps.ceremony.outputs.approve_url }}
          NOTICE_TITLE: Approve bounded.tools deploy
          NOTICE_BODY: >-
            Mints an account-wide Workers Scripts:Edit token and deploys the GitHub App
            receiver — the Worker that fans org activity out to the desk and PR feeds.
        run: |
          set -euo pipefail
          summary() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          if [ -z "${APPROVE_URL:-}" ]; then
            summary "Approval notice: skipped — no approve URL from the ceremony."
            exit 0
          fi
          tok="$(curl -sS --max-time 20 \
                   -H "authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=https://desk.bounded.tools" \
                 | jq -r '.value // empty' || true)"
          if [ -z "$tok" ]; then
            echo "::warning::could not mint an OIDC token for desk; no approval notice sent"
            summary "Approval notice: **skipped** — no OIDC token."
            exit 0
          fi
          payload="$(jq -nc --arg t "$NOTICE_TITLE" --arg b "$NOTICE_BODY" \
                       --arg u "$APPROVE_URL" --arg r "$GITHUB_RUN_ID" \
            '{title:$t, body:($b + " Run " + $r + "."), url:$u}')"
          code="$(curl -sS --max-time 30 -o /tmp/appr.json -w '%{http_code}' -X POST \
                    -H "authorization: Bearer $tok" -H 'content-type: application/json' \
                    -d "$payload" https://desk.bounded.tools/approval || true)"
          case "$code" in
            200) summary "$(jq -r '"Approval notice: sent \(.sent)/\(.total) — pruned \(.pruned), failed \(.failed)"' /tmp/appr.json)" ;;
            403) summary "Approval notice: desk has not allowlisted this lane yet (HTTP 403 — add this workflow's ref to NOTIFY_WORKFLOW_REFS in desk's src/oidc.js and deploy desk)." ;;
            404|405|503) summary "Approval notice: not available on the deployed Worker yet (HTTP $code)." ;;
            *)   echo "::warning::desk /approval answered ${code:-no response}"
                 summary "Approval notice: **failed** — desk answered ${code:-no response}." ;;
          esac
          exit 0

      - name: Wait for the Face ID, then redeem — fail closed
        env:
          KEEPER_URL: https://keeper.bounded.tools
          CEREMONY: ${{ steps.ceremony.outputs.ceremony }}
          REQ: ${{ steps.ceremony.outputs.request }}
        run: |
          set -euo pipefail
          # Poll until the human approves, the ceremony expires (15 min), or the keeper
          # says GONE. pending/gone being distinct answers is what makes this loop's
          # failure mean "never approved", not "lost a race".
          deadline="$(( $(date +%s) + 900 ))"
          auth=""
          while :; do
            code="$(curl -s --max-time 20 -o /tmp/result.json -w '%{http_code}' "$KEEPER_URL/result?id=${CEREMONY}")" || code=000
            if [ "$code" = "200" ]; then
              if jq -e '.pending' /tmp/result.json >/dev/null 2>&1; then :; else
                auth="$(jq -r '.authorizationId // empty' /tmp/result.json)"
                [ -n "$auth" ] && break
              fi
            elif [ "$code" = "410" ]; then
              echo "::error::the ceremony ended without an authorization: $(jq -r '.error // "gone"' /tmp/result.json 2>/dev/null). Nobody Face ID'd this run."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no Face ID within the 15-minute window — this run was not authorized."
              exit 1
            fi
            sleep 10
          done
          redeem="$(curl -sS --max-time 20 -X POST -H 'content-type: application/json' \
            -d "{\"authorizationId\":\"$auth\",\"requestType\":\"bounded.deploy-request.v1\",\"request\":$REQ}" \
            "$KEEPER_URL/redeem")"
          person="$(jq -r '.redeemed.person // empty' <<<"$redeem")"
          if [ -z "$person" ]; then
            echo "::error::redemption refused: $(jq -r '.error // "unknown"' <<<"$redeem"). The grant did not match this run's request — failing closed."
            exit 1
          fi
          cred="$(jq -r '.redeemed.credentialId' <<<"$redeem")"
          be="$(jq -r '.redeemed.backupEligible' <<<"$redeem")"
          {
            echo "## Authorized by Face ID"
            echo "- person: \`$person\`"
            echo "- credential: \`$cred\`"
            echo "- backupEligible: \`$be\` (synced passkey ⇒ aal2 — recorded, not assumed away)"
            echo "- request bound to run ${GITHUB_RUN_ID} @ ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "✓ authorized by $person (credential $cred)"

      - name: Close the ceremony notification
        if: ${{ steps.ceremony.outputs.issue_url != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_URL: ${{ steps.ceremony.outputs.issue_url }}
        run: gh issue close "$ISSUE_URL" --comment "Authorized by Face ID; ceremony complete." || true

      - name: Mint the deploy token (via OIDC broker /deploy/bounded-tools)
        id: token
        env:
          CF_BROKER_URL: ${{ vars.CF_BROKER_URL }}
          # ONE audience per broker TIER, shared by every target in it — target
          # identity lives in the workflowRef + environment pins, not here. A
          # per-target audience 401s at the mint and breaks infra's proofs lane
          # (check-sync's uniqueAud / Lean audiences_nodup).
          DEPLOY_AUDIENCE: cloudflare-workers-deploy-broker
        run: |
          set -euo pipefail
          # ORG variable, deliberately — a repo-level CF_BROKER_URL SHADOWS the
          # org one, and a stale shadow cost infra a month of falsely-green runs.
          [ -n "${CF_BROKER_URL:-}" ] || { echo "::error::org variable CF_BROKER_URL does not resolve here (do not set a repo-level one — it shadows)"; exit 1; }

          jwt="$(curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${DEPLOY_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::could not obtain an OIDC token for ${DEPLOY_AUDIENCE}"; exit 1; }

          body="$(curl -sf -X POST "${CF_BROKER_URL%/}/deploy/bounded-tools" -H "Authorization: Bearer $jwt")" || {
            echo "::error::broker refused to mint the deploy token."
            echo "::error::  401 = owner/audience/workflow-ref/environment pin rejected"
            echo "::error::  404 = WORKERS_DEPLOY has no 'bounded-tools' entry LIVE yet — merge the"
            echo "::error::        infra registry entry AND redeploy the broker (broker-deploy.yml)"
            echo "::error::  500 = broker misconfigured (CF_PG_WORKERS_SCRIPTS_EDIT unset)"
            exit 1
          }
          tok="$(jq -r '.token // empty' <<<"$body")"
          [ -n "$tok" ] || { echo "::error::broker returned no token"; exit 1; }
          echo "::add-mask::$tok"

          # Assert we got the intended target's token before using it.
          got_deploy="$(jq -r '.deploy // "?"' <<<"$body")"
          got_script="$(jq -r '.script // "?"' <<<"$body")"
          [ "$got_deploy" = "bounded-tools" ] && [ "$got_script" = "bounded-tools" ] || {
            echo "::error::unexpected mint response: deploy=$got_deploy script=$got_script (want bounded-tools/bounded-tools)"
            exit 1
          }
          echo "✓ minted Workers:Edit token for deploy=bounded-tools"
          echo "token=$tok" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        env:
          # The broker-minted, short-lived token — NOT a stored secret.
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          # The repo's own pinned wrangler, not a floating npx version: the
          # dry-run tripwire above and this deploy then run the SAME wrangler,
          # so "it bundled in CI" and "it bundled at deploy" cannot disagree.
          #
          # THE PIN IS 4.114.0 — the version boot/status deploy with, so the
          # sibling lanes share one proven wrangler. (Run 31886866958 blamed
          # 4.123.0 for the zone-routes 401 on custom-domain attach; run
          # 31887176578 REFUTED that — 4.114.0 preflights the same
          # /zones/{id}/workers/routes endpoint on a FIRST attach. The real
          # fix is the broker's zone-scoped `domains` read family, infra#311.
          # Redeploys of an already-attached domain never touch the zone,
          # which is why the siblings appeared to prove the version theory.)
          # Bump the pin only with the dry-run tripwire green.
          bun x wrangler deploy | tee /tmp/wrangler-deploy.log
          # Strip ANSI first — wrangler colourises, and a colour code inside a
          # hostname silently breaks the match.
          sed 's/\x1b\[[0-9;]*m//g' /tmp/wrangler-deploy.log > /tmp/wd-plain.log
          # Two different shapes in that output, hence two parses:
          #   "  https://bounded-tools.<sub>.workers.dev"  ← full URL
          #   "  bounded.tools (custom domain)"            ← bare hostname
          url="$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/wd-plain.log | head -n1 || true)"
          custom="$(grep -E '\(custom domain\)' /tmp/wd-plain.log | head -n1 | awk '{print $1}' || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "custom_domain=$custom" >> "$GITHUB_OUTPUT"
          [ -n "$url" ] && echo "workers.dev: $url" || echo "no workers.dev URL in this deploy (workers_dev is false)"
          [ -n "$custom" ] && echo "custom domain: $custom" || echo "no custom domain in this deploy"

      # The webhook secret, as an OIDC artifact — generated here, never seen by
      # anyone, both halves written by machinery. Worker half FIRST: if the App
      # half then fails, deliveries are signed with the old secret against a
      # Worker holding the new one — rejected, fail closed — and the run FAILS
      # naming the one fix (re-run). The reverse order has the same window; what
      # matters is that a partial failure is loud and converges on re-run.
      - name: Sync webhook secret (OIDC artifact — nobody holds it)
        if: ${{ inputs.sync_webhook_secret }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          CF_BROKER_URL: ${{ vars.CF_BROKER_URL }}
          APPHOOK_AUDIENCE: app-hook-broker
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"

          # Worker half — a script-settings write under the SAME minted token
          # (infra's `rotate` precedent: a secret put IS a deploy).
          printf '%s' "$secret" | bun x wrangler secret put GITHUB_WEBHOOK_SECRET

          # App half — the broker PATCHes the App's hook config as the App.
          jwt="$(curl -sf "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${APPHOOK_AUDIENCE}" \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" | jq -r '.value // empty')"
          [ -n "$jwt" ] || { echo "::error::could not obtain an OIDC token for ${APPHOOK_AUDIENCE}"; exit 1; }

          body="$(curl -sf -X POST "${CF_BROKER_URL%/}/apphook/bounded-tools" \
            -H "Authorization: Bearer $jwt" -H "content-type: application/json" \
            -d "{\"secret\":\"$secret\"}")" || {
            echo "::error::broker refused the App-side secret write. THE HALVES NOW DISAGREE:"
            echo "::error::the Worker holds a new secret, the App still signs with the old one,"
            echo "::error::so every delivery is rejected (fail closed) until a re-run converges them."
            echo "::error::  401 = audience/workflow-ref/owner pin rejected"
            echo "::error::  404 = APP_HOOK_CONFIG has no live bounded-tools entry — merge the infra"
            echo "::error::        registry AND redeploy the broker (broker-deploy.yml)"
            echo "::error::  500 = appId unfilled or GH_APP_PRX_PRIVATE_KEY not set on the broker"
            echo "::error::        (bootstrap steps in infra's APP_HOOK_CONFIG comment)"
            echo "::error::  502 = GitHub refused the hook-config PATCH"
            exit 1
          }
          hook_url="$(jq -r '.hook_url // "?"' <<<"$body")"
          echo "✓ webhook secret rotated on both sides (App hook: $hook_url)"

      - name: Note the skipped secret sync
        if: ${{ !inputs.sync_webhook_secret }}
        run: |
          echo "::warning::sync_webhook_secret=false — the Worker may hold no (or a stale)"
          echo "::warning::GITHUB_WEBHOOK_SECRET. The receiver fails closed: /ci.json serves,"
          echo "::warning::but every delivery is rejected until a run with the sync enabled."

      # Not "does something answer" — the static site answers today, with a
      # 404, which is exactly how this Worker's absence went unnoticed. So probe
      # a route only the WORKER can serve, and check the body, not the status.
      #
      # A deploy that parsed no hostname fails here rather than passing
      # vacuously: a verification guaranteed to skip on the run where nothing
      # is yet proven is the "green from a job that did nothing" defect this
      # whole project exists to catch.
      - name: Liveness probe (every hostname this deploy exposed)
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.url }}
          CUSTOM_DOMAIN: ${{ steps.deploy.outputs.custom_domain }}
        run: |
          set -euo pipefail
          targets=()
          [ -n "${CUSTOM_DOMAIN:-}" ] && targets+=("https://${CUSTOM_DOMAIN}")
          [ -n "${DEPLOYED_URL:-}" ] && targets+=("${DEPLOYED_URL%/}")
          [ ${#targets[@]} -gt 0 ] || { echo "::error::deploy exposed no parseable hostname — nothing was verified"; exit 1; }

          for base in "${targets[@]}"; do
            echo "── probing $base"

            # /health: the Worker answers "ok" in plain text. The static site
            # answers 404 with HTML, so this distinguishes "the Worker is
            # serving" from "something is serving" — the exact confusion that
            # let a never-deployed receiver look fine for months.
            #
            # Retried, because the FIRST attach of a custom domain is not
            # instantly resolvable: run 31889379320 deployed and attached
            # successfully, then died here 0.2s later on curl exit 6 (could
            # not resolve host) — the identical probe passed minutes later.
            # Bounded retries absorb DNS/edge propagation; the final state is
            # still asserted strictly, so a Worker that never comes up (or
            # serves the wrong body) fails the run exactly as before.
            health=""
            for attempt in $(seq 1 12); do
              health="$(curl -sS --max-time 20 "$base/health" 2>/tmp/health-err || true)"
              [ "$health" = "ok" ] && break
              echo "  … attempt $attempt: not serving yet ($(head -c 120 /tmp/health-err)${health:+body: ${health:0:80}}) — retrying in 15s"
              sleep 15
            done
            [ "$health" = "ok" ] || { echo "::error::$base/health returned '${health:0:120}' (want 'ok') after $attempt attempts"; exit 1; }
            echo "  ✓ /health (attempt $attempt)"

            # /ci.json: valid JSON carrying the contract's two mandatory fields.
            snap="$(curl -sS --max-time 20 "$base/ci.json")"
            jq -e '.generated_at and (.coverage_complete | type == "boolean")' >/dev/null <<<"$snap" || {
              echo "::error::$base/ci.json is not a valid snapshot: ${snap:0:200}"; exit 1; }

            # Second-precision RFC 3339, enforced because jq's fromdateiso8601
            # rejects fractional seconds — a worker emitting milliseconds would
            # have every consumer read its snapshot as unanswered.
            stamp="$(jq -r '.generated_at' <<<"$snap")"
            [[ "$stamp" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || {
              echo "::error::generated_at '$stamp' is not second-precision RFC 3339 UTC"; exit 1; }
            jq -e --arg s "$stamp" '$s | fromdateiso8601 | . > 0' >/dev/null <<<"$snap" || {
              echo "::error::generated_at '$stamp' does not parse with fromdateiso8601 (the consumers' parser)"; exit 1; }
            echo "  ✓ /ci.json (generated_at $stamp)"
          done

          echo "::notice::Deployed and serving. The receiver still ingests nothing until"
          echo "::notice::GITHUB_WEBHOOK_SECRET is set as a Worker Secret and the App's"
          echo "::notice::hook URL points here — /ci.json will report coverage_complete: false."

      # The relay lease, as lane-held custody (#53; the infra#294 direction —
      # secrets ride gated lanes, never a laptop `wrangler secret put`). The
      # token is generated HERE, masked, written under the same minted
      # credential (a secret put IS a deploy — infra's `rotate` precedent), and
      # leaves the job age-encrypted or not at all. Single-holder v1: the put
      # overwrites the WHOLE lease table with one `sessions:<token>` line.
      #
      # AFTER the liveness probe on purpose: a deploy that failed verification
      # must not write secrets, and the probe has already absorbed DNS/edge
      # propagation so this step's own retries only cover secret-version
      # rollout. The host is a literal for the same reason the keeper URL is —
      # configuration must not be able to point the verify somewhere else.
      - name: Rotate the Claude relay lease (age-encrypted hand-off)
        if: ${{ inputs.rotate_relay_lease }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          RECIPIENT: ${{ inputs.lease_recipient }}
          RELAY_BASE: https://hooks.bounded.tools
        run: |
          set -euo pipefail
          # Guard the recipient's VALIDITY before writing, not just its
          # presence: a malformed recipient that fails only at encryption time
          # strands a live lease nobody can read — the exact state
          # rotate-lease-key.yml's probe exists to prevent.
          [ -n "${RECIPIENT:-}" ] || { echo "::error::rotate_relay_lease needs lease_recipient (an ephemeral age recipient) — nothing was written"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq age
          printf 'probe' | age -r "$RECIPIENT" -a >/dev/null 2>&1 || {
            echo "::error::age rejected the recipient — NOTHING was written, the lease is untouched."
            echo "::error::  expected an age1… public key or an ssh-ed25519/ssh-rsa public key line"
            echo "::error::  note: age does NOT support FIDO/sk-ssh-* keys as recipients"
            exit 1
          }

          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf 'sessions:%s' "$token" | bun x wrangler secret put CLAUDE_RELAY_LEASES

          # Verify with the relay's own status discriminators, on the live
          # host: 503 = no parseable lease (the write failed, or has not
          # propagated), 401 = configured and refusing a garbage bearer — the
          # flip that proves the secret dereferences. Then the NEW token
          # against a malformed body must answer 400: authenticated past the
          # lease gate, nothing fetched, nothing spent.
          code=""
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$RELAY_BASE/claude/sessions" \
              -H 'authorization: Bearer garbage-bearer-000000000000' \
              -H 'content-type: application/json' -d '{}' || true)"
            [ "$code" = "401" ] && break
            echo "  … attempt $attempt: garbage bearer answered '${code:-none}' (want 401) — retrying in 10s"
            sleep 10
          done
          [ "$code" = "401" ] || { echo "::error::relay still answers ${code:-nothing} to a garbage bearer — the lease did not arm"; exit 1; }
          ok="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$RELAY_BASE/claude/sessions" \
            -H "authorization: Bearer $token" -H 'content-type: application/json' -d '{}' || true)"
          [ "$ok" = "400" ] || { echo "::error::the NEW token answered ${ok:-nothing} to a malformed body (want 400) — refusing to hand off a token that does not authenticate"; exit 1; }
          echo "✓ lease armed: the 503→401 flip observed, and the new token authenticates (lease name: sessions)"

          echo "==== relay lease token — the Authorization bearer for /claude/sessions ======"
          echo "==== decrypt: age -d -i <your ephemeral identity>                        ===="
          printf '%s' "$token" | age -r "$RECIPIENT" -a

      # A per-session grant (#62): same custody as the rotate step above, into
      # a SLOT instead of the standing line. Worker Secrets are write-only, so
      # multi-holder is a bounded ring — the stale slot is overwritten
      # (displacing only the OLDEST grant), and which slot is stale is
      # bookkeeping over names and dates in a repo variable, the
      # rotate-lease-key.yml convention.
      - name: Grant a per-session relay lease (age-encrypted hand-off)
        if: ${{ inputs.grant_relay_lease != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.token.outputs.token }}
          RECIPIENT: ${{ inputs.lease_recipient }}
          GRANT_NAME: ${{ inputs.grant_relay_lease }}
          RELAY_BASE: https://hooks.bounded.tools
          SLOT_LAST: ${{ vars.RELAY_LEASE_SLOT_LAST }}
        run: |
          set -euo pipefail
          # The lease-table grammar is names-colon-tokens; a name that cannot
          # appear in it must fail before anything is written, like the
          # recipient below.
          printf '%s' "$GRANT_NAME" | grep -Eq '^[A-Za-z0-9._-]+$' || {
            echo "::error::grant_relay_lease must match [A-Za-z0-9._-]+ — nothing was written"; exit 1; }
          [ -n "${RECIPIENT:-}" ] || { echo "::error::grant_relay_lease needs lease_recipient (an ephemeral age recipient) — nothing was written"; exit 1; }
          command -v age >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq age; }
          printf 'probe' | age -r "$RECIPIENT" -a >/dev/null 2>&1 || {
            echo "::error::age rejected the recipient — NOTHING was written, the slots are untouched."
            exit 1
          }

          # Round-robin: overwrite the slot NOT written last. An unset variable
          # means no grant has ever landed — start at A.
          case "${SLOT_LAST:-B}" in
            A) slot=B ;;
            *) slot=A ;;
          esac

          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          printf '%s:%s' "$GRANT_NAME" "$token" | bun x wrangler secret put "CLAUDE_RELAY_LEASES_$slot"

          # The new token must authenticate before it is handed off: 400 on a
          # malformed body = past the lease gate, nothing fetched. Bounded
          # retries absorb secret-version rollout. (No 503/401 discriminator
          # here — the standing line keeps the relay armed throughout.)
          ok=""
          for attempt in $(seq 1 12); do
            ok="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$RELAY_BASE/claude/sessions" \
              -H "authorization: Bearer $token" -H 'content-type: application/json' -d '{}' || true)"
            [ "$ok" = "400" ] && break
            echo "  … attempt $attempt: new token answered '${ok:-none}' (want 400) — retrying in 10s"
            sleep 10
          done
          [ "$ok" = "400" ] || { echo "::error::the granted token answered ${ok:-nothing} (want 400) — refusing to hand off a token that does not authenticate"; exit 1; }

          gh variable set RELAY_LEASE_SLOT_LAST --body "$slot"
          echo "✓ grant '$GRANT_NAME' written to slot $slot and verified live"

          echo "==== granted relay lease token ($GRANT_NAME) ================================"
          echo "==== decrypt: age -d -i <your ephemeral identity>                        ===="
          printf '%s' "$token" | age -r "$RECIPIENT" -a
