name: standard
# The org's shared test/security lane. Added with the CI-aggregator core
# (.github-private#481): this repo had no lane that ran anything, so a test file
# here would have been decoration — green by never being executed. Adding the
# tests and the gate that runs them in the same change is the point; a check
# nothing runs is the failure mode claude-box#252 just cost five days to.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@63715f952022f2edfef72c0a4a0ec94e48e51e71
    with:
      security: true
      test: true
      runtime: bun
      # `bun install` first: tsc resolves its `types` from the installed
      # packages, and without the install it fails with TS2688 rather than any
      # real type error.
      #
      # The wrangler dry-run is the only check that the Worker actually BUILDS —
      # bun test never loads the entry point, and tsc does not validate
      # wrangler.jsonc or the Durable Object binding. It needs no credentials.
      test-command: "bun install --frozen-lockfile && bun test && bun x tsc --noEmit && WRANGLER_SEND_METRICS=false bun x wrangler deploy --dry-run"
